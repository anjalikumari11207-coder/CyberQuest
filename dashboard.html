<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQuest — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow-y: auto; background: var(--bg-dark); }
    .dash-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
    .stat-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { padding: 20px; text-align: center; background: rgba(10,20,40,0.8); border: 1px solid var(--border-glow); border-radius: var(--radius-lg); }
    .stat-card .big { font-family: var(--font-game); font-size: 2.2rem; color: var(--cyan); display: block; }
    .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); }
    .badge-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .module-progress { display: flex; flex-direction: column; gap: 10px; }
    .mod-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: rgba(10,20,40,0.7); border: 1px solid var(--border-glow); border-radius: 10px; }
    .mod-row-icon { font-size: 1.4rem; width: 36px; text-align: center; }
    .mod-row-name { flex: 1; font-family: var(--font-game); font-size: 0.78rem; }
    .mod-row-status { font-size: 0.8rem; font-family: var(--font-game); }
    .leaderboard-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border-glow); }
    .lb-rank { font-family: var(--font-game); font-size: 1rem; width: 28px; text-align: center; }
    .lb-name { flex: 1; font-size: 0.88rem; }
    .lb-xp { font-family: var(--font-game); font-size: 0.82rem; color: var(--gold); }
    .tip-card { background: rgba(0,245,255,0.06); border: 1px solid var(--border-glow); border-radius: 12px; padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; }
    .tip-icon { font-size: 1.5rem; flex-shrink: 0; }
    @media(max-width:900px){ .dash-grid{grid-template-columns:1fr;} .badge-grid{grid-template-columns:repeat(3,1fr);} .stat-cards{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="cq-nav">
    <div class="cq-nav-logo">⚡ CyberQuest</div>
    <div class="cq-nav-links">
      <a href="world.html">🌍 CyberCity</a>
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="#" onclick="Auth.logout()">🚪 Logout</a>
    </div>
  </nav>

  <div class="page-container">
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:32px" class="fade-in-up">
      <div id="dash-avatar" style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:2.4rem;border:3px solid var(--border-glow)">🦸</div>
      <div>
        <h1 style="font-size:1.6rem;margin-bottom:4px" id="dash-username">Loading...</h1>
        <div id="dash-level" style="color:var(--cyan);font-family:var(--font-game);font-size:0.88rem"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span class="streak-fire">🔥</span>
          <span id="dash-streak" style="font-family:var(--font-game);font-size:0.9rem;color:var(--gold)">0 Day Streak</span>
        </div>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards fade-in-up">
      <div class="stat-card"><span class="big" id="s-xp">0</span><div class="lbl">Total XP</div></div>
      <div class="stat-card"><span class="big" id="s-badges">0</span><div class="lbl">Badges Earned</div></div>
      <div class="stat-card"><span class="big" id="s-modules">0/6</span><div class="lbl">Modules Done</div></div>
    </div>

    <!-- XP Progress Bar -->
    <div class="glass-card" style="padding:20px;margin-bottom:24px" id="xp-section">
      <div style="display:flex;justify-content:space-between;font-family:var(--font-game);font-size:0.8rem;margin-bottom:8px">
        <span id="xp-level-name" style="color:var(--cyan)">Noob 🐣</span>
        <span id="xp-next" style="color:var(--text-muted)">Next: Aware 👀</span>
        <span id="xp-val" style="color:var(--gold)">0 XP</span>
      </div>
      <div class="xp-bar-wrap" style="height:14px">
        <div class="xp-bar-fill" id="xp-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="dash-grid">
      <!-- LEFT -->
      <div>
        <!-- Daily Tip -->
        <div class="section-header"><h2>💡 Daily Cyber Tip</h2></div>
        <div class="tip-card glass-card" style="margin-bottom:24px" id="daily-tip">
          <div class="tip-icon">💡</div>
          <div id="tip-text" style="font-size:0.88rem;line-height:1.7;color:var(--text-main)">Loading tip...</div>
        </div>

        <!-- Module Progress -->
        <div class="section-header"><h2>🎯 Mission Progress</h2></div>
        <div class="module-progress" id="module-progress"></div>

        <a href="world.html" class="btn btn-primary" style="margin-top:20px;width:100%;justify-content:center">
          ⚡ Continue in CyberCity
        </a>
      </div>

      <!-- RIGHT -->
      <div>
        <!-- Badges -->
        <div class="section-header"><h2>🏅 Badges & Achievements</h2></div>
        <div class="badge-grid" id="badge-grid" style="margin-bottom:28px"></div>

        <!-- Leaderboard -->
        <div class="section-header"><h2>🏆 Leaderboard</h2></div>
        <div class="glass-card" id="leaderboard-wrap">
          <div id="leaderboard-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = Utils.requireAuth();
    if(!user) throw new Error('Not authenticated');

    const TIPS = [
      '🔐 Use a different password for every account. A password manager like Bitwarden (free!) makes this effortless.',
      '📱 Enable Two-Factor Authentication (2FA) on your Gmail, Instagram, and banking apps — right now!',
      '🎣 Before clicking any link, hover over it to see the actual URL. Does it match the sender\'s domain?',
      '📶 Never do banking or access sensitive accounts on public WiFi. Use mobile data or a VPN.',
      '🔒 Set ALL your social media profiles to Private. Review who can see your posts, stories, and info.',
      '🦠 Scan any downloaded file at VirusTotal.com before opening it — it\'s free and takes 30 seconds.',
      '📅 Change your important passwords every 3–6 months. Set a calendar reminder today!',
      '🚫 Never share OTPs with anyone — not even people claiming to be from your bank.',
      '👥 Verify friend requests from strangers. Fake profiles are used for social engineering.',
      '📱 Keep your phone and apps updated — updates often contain critical security patches.',
      '🔍 Check the sender\'s email domain carefully. "support@amaz0n.in" is NOT Amazon.',
      '💾 Back up your important data to an external drive or cloud regularly. Ransomware is real.',
      '🔑 Your password should NOT contain your name, birthday, or pet\'s name — hackers try these first.',
      '📵 Log out of accounts on shared/public computers. Always.',
      '🛡️ Install a reputable antivirus. Windows Defender (free) is actually quite good!',
    ];

    const MODULES = [
      { key:'alex_story',  name:"Alex's Story",      icon:'📖', color:'#ff6600' },
      { key:'password',    name:'Password Fortress',  icon:'🔐', color:'#0055ff' },
      { key:'phishing',    name:'Phishing Lake',      icon:'🎣', color:'#00cc55' },
      { key:'malware',     name:'Malware Maze',       icon:'🌀', color:'#9900ff' },
      { key:'social',      name:'Social Shield',      icon:'🔒', color:'#00cccc' },
      { key:'hero_hq',     name:'CyberHero HQ',       icon:'🦸', color:'#ffcc00' },
    ];

    function renderDashboard() {
      const u = Auth.getCurrentUser();
      if(!u) return;

      // Header
      document.getElementById('dash-avatar').textContent = u.avatar || '🦸';
      document.getElementById('dash-username').textContent = `${u.username}'s Dashboard`;
      const lvl = Rewards.getLevel(u.xp);
      document.getElementById('dash-level').textContent = `${lvl.icon} ${lvl.name} — ${u.xp} XP total`;
      document.getElementById('dash-streak').textContent = `${u.streak || 0} Day Streak`;

      // Stats
      document.getElementById('s-xp').textContent = Utils.formatNumber(u.xp);
      document.getElementById('s-badges').textContent = (u.badges||[]).length;
      document.getElementById('s-modules').textContent = `${(u.completedModules||[]).length}/6`;

      // XP bar
      const next = Rewards.getNextLevel(u.xp);
      document.getElementById('xp-level-name').textContent = `${lvl.icon} ${lvl.name}`;
      document.getElementById('xp-next').textContent = next ? `Next: ${next.icon} ${next.name} at ${next.min} XP` : '🏆 Max Level!';
      document.getElementById('xp-val').textContent = `${u.xp} XP`;
      setTimeout(()=>{ document.getElementById('xp-bar').style.width = Rewards.getLevelProgress(u.xp)+'%'; },100);

      // Daily tip
      const tipIdx = (new Date().getDate()) % TIPS.length;
      document.getElementById('tip-text').textContent = TIPS[tipIdx];

      // Module progress
      const mp = document.getElementById('module-progress');
      mp.innerHTML = MODULES.map(m=>{
        const done = (u.completedModules||[]).includes(m.key);
        return `<div class="mod-row">
          <div class="mod-row-icon">${m.icon}</div>
          <div class="mod-row-name" style="color:${done?m.color:'var(--text-muted)'}">${m.name}</div>
          <div class="mod-row-status" style="color:${done?'var(--green)':'var(--text-dim)'}">${done?'✅ DONE':'⏳ Pending'}</div>
        </div>`;
      }).join('');

      // Badges
      const bg = document.getElementById('badge-grid');
      bg.innerHTML = Object.entries(Rewards.BADGES).map(([key,b])=>{
        const earned = (u.badges||[]).includes(key);
        return `<div class="badge-item ${earned?'earned':'locked'}" title="${b.desc}">
          <div class="badge-icon">${b.icon}</div>
          <div class="badge-name">${b.name}</div>
          ${earned?`<div style="font-size:0.6rem;color:var(--gold);font-family:var(--font-game)">+${b.xp}XP</div>`:''}
        </div>`;
      }).join('');

      // Leaderboard
      const all = Auth.getAllUsers();
      const ll = document.getElementById('leaderboard-list');
      if(all.length===0){
        ll.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.85rem">No other players yet. Share CyberQuest!</div>';
      } else {
        ll.innerHTML = all.slice(0,10).map((p,i)=>{
          const medals=['🥇','🥈','🥉'];
          const isMe = p.username===u.username;
          return `<div class="leaderboard-row" style="${isMe?'background:rgba(0,245,255,0.07);':''}">
            <div class="lb-rank">${medals[i]||`#${i+1}`}</div>
            <div style="font-size:1.2rem">${p.username[0]||'🦸'}</div>
            <div class="lb-name" style="${isMe?'color:var(--cyan)':''}">${p.username}${isMe?' (You)':''}</div>
            <div class="lb-xp">${Utils.formatNumber(p.xp)} XP</div>
            <div style="font-size:0.72rem;color:var(--text-dim)">${Rewards.getLevel(p.xp).icon}</div>
          </div>`;
        }).join('');
      }
    }

    renderDashboard();
  </script>
</body>
</html>
